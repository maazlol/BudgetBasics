      <text x="355" y="517" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Track</text>
      <text x="355" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#6E687A">watch every rupee</text>

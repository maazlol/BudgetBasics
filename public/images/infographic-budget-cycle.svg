      <circle cx="273" cy="258" r="22" fill="#2A2633"/>
      <text x="273" y="265" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">5</text>
      <text x="225" y="307" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Adjust</text>

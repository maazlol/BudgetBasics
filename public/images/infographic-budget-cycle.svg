      <text x="450" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Earn</text>
      <text x="450" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#6E687A">money comes in</text>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-label="Monthly budget cycle flow diagram">
  <rect width="900" height="675" fill="#F3F2EE"/>
  <rect x="30" y="30" width="840" height="615" rx="28" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="3"/>

  <path d="M30 58 Q30 30 58 30 L842 30 Q870 30 870 58 L870 118 L30 118 Z" fill="#575091"/>
  <text x="450" y="88" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">Your Monthly Budget Cycle</text>

  <g stroke="#E4DFD7" stroke-width="6" fill="none">
    <path d="M450 190 L640 262"/>
    <path d="M660 330 L575 470"/>
    <path d="M500 520 L400 520"/>

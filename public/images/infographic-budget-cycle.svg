      <text x="675" y="307" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Plan</text>
      <text x="675" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#6E687A">set your limits</text>
    </g>

    <g>
      <circle cx="545" cy="510" r="62" fill="#D6A443"/>
      <circle cx="593" cy="468" r="22" fill="#C67A3D"/>
      <text x="593" y="475" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
      <text x="545" y="517" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Spend</text>
      <text x="545" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#6E687A">use with care</text>

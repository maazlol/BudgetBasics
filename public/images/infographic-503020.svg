<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-label="The 50 30 20 Rule infographic">
  <rect width="900" height="675" fill="#F3F2EE"/>
  <rect x="30" y="30" width="840" height="615" rx="28" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="3"/>

